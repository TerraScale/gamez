packages:
  - apps/*
  - packages/*
  - modules/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  react: 19.3.0
  react-dom: 19.3.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# Build scripts needed by the Cloudflare toolchain.
allowBuilds:
  esbuild: true
  workerd: true
